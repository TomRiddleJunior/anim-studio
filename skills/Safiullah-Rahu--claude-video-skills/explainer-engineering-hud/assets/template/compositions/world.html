<template>

  </style>
  <div id="root" data-composition-id="world" data-width="1080" data-height="1920">

      <div class="brk" id="b210"><div class="ln"></div><div class="tk t0"></div><div class="tk t1"></div><div class="lab"><div class="big">210 m</div><div class="sm">EACH GATE · 22 m HIGH</div></div></div>
      <div class="tag" id="tTide"><div class="mk cy"></div><span>TIDE · ON SCHEDULE</span></div>

      <div class="tag red" id="tHalt"><div class="mk fill"></div><span>SHIPPING HALTED</span></div>

      <div class="tag" id="tHoek"><div class="mk cy"></div><span>BARRIER</span></div>

    </div>
  </div>
  <script>
    (function () {
      const F = window.FILM, G = window.GEO;
      const { lin, mix, clamp, E, W, T, SH } = F;
      let ready = false, lastT = -1, curT = 0, render3 = null;
      function draw(t) {
        curT = t;
        t = Math.round(t * 10000) / 10000;
        if (!ready || t === lastT) return;
        lastT = t;
        render3(t);
      }
      let seed = 11;
      const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady.world = Promise.all([window.t3Ready, document.fonts.ready]).then(async ([T3]) => {
        const X = T3.THREE;
        await Promise.all([document.fonts.load("700 30px 'Space Grotesk'"), document.fonts.load("800 50px Inter")]);
        const canvas = document.getElementById("wc");
        const renderer = new X.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
        renderer.setPixelRatio(1); renderer.setSize(1080, 1920, false);
        renderer.outputColorSpace = X.SRGBColorSpace;
        renderer.toneMapping = X.NeutralToneMapping; renderer.toneMappingExposure = 1.0;
        const scene = new X.Scene();
        const BG = new X.Color("#0b1119");
        scene.background = BG;
        scene.fog = new X.Fog("#0b1119", 60, 260);
        const cam = new X.PerspectiveCamera(32, 1080 / 1920, 0.1, 4000);

        // ---------- lights (soft night: sky fill + a cool key from the north-west)
        const hemi = new X.HemisphereLight("#b9cce4", "#0a0f16", 1.9); scene.add(hemi);
        const key = new X.DirectionalLight("#c4d6ea", 1.25); key.position.set(-40, 80, 30); scene.add(key);
        const rim = new X.DirectionalLight("#2f5a7a", 0.6); rim.position.set(60, 30, -50); scene.add(rim);

        // ---------- materials
        const M = (c, o = {}) => new X.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.92, metalness: 0.02, flatShading: true }, o));
        const mLand = M("#222a36"), mLandSide = M("#121821"), mBlock = M("#1e2531"), mBlockTop = M("#27303d");
        const mWater = M("#0e2435", { roughness: 0.6, metalness: 0.05, flatShading: false });
        const mConc = M("#2c333d"), mDockFloor = M("#1a1f27");
        const mGate = M("#d6dbe1", { roughness: 0.55 }), mTruss = M("#c4cad1", { roughness: 0.6 });
        const mJoint = M("#b9c3cd", { roughness: 0.35, metalness: 0.3, flatShading: false });
        const glow = (r, g, b) => new X.MeshBasicMaterial({ color: new X.Color(r, g, b), toneMapped: false });
        const mCyan = glow(0.32, 1.75, 2.3), mRed = glow(2.6, 0.22, 0.32), mAmber = glow(2.4, 1.3, 0.35);
        const halo = (c, o) => new X.MeshBasicMaterial({ color: c, transparent: true, opacity: o, blending: X.AdditiveBlending, depthWrite: false, toneMapped: false });
        const spriteTex = (() => { const c = document.createElement("canvas"); c.width = c.height = 128; const x = c.getContext("2d");
          const g = x.createRadialGradient(64, 64, 0, 64, 64, 64); g.addColorStop(0, "rgba(255,255,255,1)"); g.addColorStop(0.25, "rgba(255,255,255,0.55)"); g.addColorStop(1, "rgba(255,255,255,0)");
          x.fillStyle = g; x.fillRect(0, 0, 128, 128); const t = new X.CanvasTexture(c); return t; })();
        const dotTex = (() => { const c = document.createElement("canvas"); c.width = c.height = 32; const x = c.getContext("2d");
          x.fillStyle = "#fff"; x.beginPath(); x.arc(16, 16, 13, 0, Math.PI * 2); x.fill(); return new X.CanvasTexture(c); })();
        function glowSprite(col, s, op = 1) {
          const sp = new X.Sprite(new X.SpriteMaterial({ map: spriteTex, color: col, transparent: true, opacity: op, blending: X.AdditiveBlending, depthWrite: false, toneMapped: false }));
          sp.scale.set(s, s, 1); return sp;
        }
        function beam(a, b, r, mat) {
          const L = a.distanceTo(b);
          const m = new X.Mesh(new X.BoxGeometry(r, r, L), mat);
          m.position.copy(a).add(b).multiplyScalar(0.5); m.lookAt(b); return m;
        }
        function tube(pts, r, mat, seg = 64) {
          const cv = new X.CatmullRomCurve3(pts, false, "centripetal");
          return new X.Mesh(new X.TubeGeometry(cv, seg, r, 6, false), mat);
        }
        const V3 = (x, y, z) => new X.Vector3(x, y, z);
        // shape helper: points in (x, z) world plan -> extruded upward from y0 to y1
        function slab(pts, y0, y1, mat, holes) {
          const sh = new X.Shape(pts.map(([x, z]) => new X.Vector2(x, -z)));
          (holes || []).forEach((h) => sh.holes.push(new X.Path(h.map(([x, z]) => new X.Vector2(x, -z)))));
          const g = new X.ExtrudeGeometry(sh, { depth: y1 - y0, bevelEnabled: false, curveSegments: 4 });
          g.rotateX(-Math.PI / 2); g.translate(0, y0, 0);
          return new X.Mesh(g, mat);
        }
        function flat(pts, y, mat) {
          const sh = new X.Shape(pts.map(([x, z]) => new X.Vector2(x, -z)));
          const g = new X.ShapeGeometry(sh, 6); g.rotateX(-Math.PI / 2); g.translate(0, y, 0);
          return new X.Mesh(g, mat);
        }

        // =====================================================================================
        // SET 1: the barrier (1 unit = 10 m). Channel along x (sea at -x), 360 m wide (z -18..18).
        // =====================================================================================
        const SB = new X.Group(); scene.add(SB);
        const R = 23.7, JX = 12, JZ = 19, COAST = -40, LX = 170, LZ = 170;
        const BETA0 = 0.034, BETA1 = 0.92;
        // water: channel strip + sea
        const water = new X.Group(); SB.add(water);
        water.add(flat([[COAST - 400, -LZ - 200], [LX + 50, -LZ - 200], [LX + 50, LZ + 200], [COAST - 400, LZ + 200]], 0, mWater));
        // water grid (faint)
        {
          const pos = [];
          for (let x = COAST - 300; x <= LX; x += 8) pos.push(x, 0.03, -LZ - 150, x, 0.03, LZ + 150);
          for (let z = -LZ - 150; z <= LZ + 150; z += 8) pos.push(COAST - 300, 0.03, z, LX, 0.03, z);
          const g = new X.BufferGeometry(); g.setAttribute("position", new X.Float32BufferAttribute(pos, 3));
          water.add(new X.LineSegments(g, new X.LineBasicMaterial({ color: "#1d3a50", transparent: true, opacity: 0.45 })));
        }
        // banks with a pie-shaped dock notch at each joint
        function bankPts(side) { // side -1 north (z<0), +1 south
          const s = side, pts = [];
          const outR = R + 1.6;
          pts.push([COAST, s * 18]);
          pts.push([JX - outR, s * 18]);
          for (let k = 0; k <= 16; k++) { const b = -1.02 * k / 16; pts.push([JX - outR * Math.cos(b), s * (JZ - outR * Math.sin(b))]); }
          pts.push([JX + 1.8, s * (JZ + 1.6)]);
          pts.push([JX + 1.8, s * 18]);
          pts.push([LX, s * 18]); pts.push([LX, s * LZ]); pts.push([COAST, s * LZ]);
          // a gentle coastline wobble
          return s < 0 ? pts : pts;
        }
        const bankN = slab(bankPts(-1), -2.2, 0.55, [mLandSide, mLand]); SB.add(bankN);
        const bankS = slab(bankPts(1), -2.2, 0.55, [mLandSide, mLand]); SB.add(bankS);
        bankN.material = [mLand, mLandSide]; bankS.material = [mLand, mLandSide];
        // dock floors (dry) and dock water (rises when flooded)
        function piePts(side, r0, r1, b0, b1) {
          const pts = [];
          for (let k = 0; k <= 16; k++) { const b = mix(b0, b1, k / 16); pts.push([JX - r1 * Math.cos(b), side * (JZ - r1 * Math.sin(b))]); }
          for (let k = 16; k >= 0; k--) { const b = mix(b0, b1, k / 16); pts.push([JX - r0 * Math.cos(b), side * (JZ - r0 * Math.sin(b))]); }
          return pts;
        }
        const dockWaterM = [];
        for (const s of [-1, 1]) {
          SB.add(flat(piePts(s, 0.8, R + 1.6, 0.05, -1.02), -1.75, mDockFloor));
          const dw = flat(piePts(s, 0.8, R + 1.6, 0.05, -1.02), -1.7, mWater); SB.add(dw); dockWaterM.push(dw);
        }
        // city blocks (instanced, stepped)
        {
          const base = [], top = [];
          for (let x = COAST + 6; x < LX - 4; x += 3.3) for (let z = 24; z < LZ - 4; z += 3.3) for (const s of [-1, 1]) {
            const zz = s * z + (rnd() - 0.5) * 0.6, xx = x + (rnd() - 0.5) * 0.6;
            const dj = Math.hypot(xx - JX, zz - s * JZ);
            if (dj < R + 5.5 && xx < JX + 4) continue;           // dock area
            if (Math.abs(xx + 30) < 6 && s < 0 && Math.abs(zz + 34) < 6) continue; // BOS building lot
            if (rnd() < 0.18) continue;
            const w = 1.4 + rnd() * 1.4, d = 1.2 + rnd() * 1.4, h = 0.18 + rnd() * rnd() * 1.1;
            base.push([xx, zz, w, d, h]);
            if (rnd() < 0.45) top.push([xx + (rnd() - 0.5) * 0.4, zz + (rnd() - 0.5) * 0.4, w * 0.6, d * 0.6, h + 0.2 + rnd() * 0.5]);
          }
          const bg = new X.BoxGeometry(1, 1, 1); bg.translate(0, 0.5, 0);
          for (const [arr, mat] of [[base, mBlock], [top, mBlockTop]]) {
            const im = new X.InstancedMesh(bg, mat, arr.length); const o = new X.Object3D();
            arr.forEach(([x, z, w, d, h], i) => { o.position.set(x, 0.55, z); o.scale.set(w, h, d); o.updateMatrix(); im.setMatrixAt(i, o.matrix); });
            SB.add(im);
          }
        }
        // quay edges along the channel (thin light lines)
        for (const s of [-1, 1]) {
          SB.add(beam(V3(COAST, 0.57, s * 18.05), V3(JX - R - 1.6, 0.57, s * 18.05), 0.12, M("#3a4452")));
          SB.add(beam(V3(JX + 1.8, 0.57, s * 18.05), V3(LX, 0.57, s * 18.05), 0.12, M("#3a4452")));
        }
        // ---------- the two arms (gate wall + truss + ball joint)
        function arm(side) {
          const g = new X.Group(), s = side; // local: joint at origin; closed arc p(b) = R(-cos b, 0, -s*sin b)
          const P = (r, b, y) => V3(-r * Math.cos(b), y, -s * r * Math.sin(b));
          // gate wall: annular sector, 22 m high (y -1.6..0.6 in its dock), 0.75 deep
          const sh = [];
          for (let k = 0; k <= 24; k++) { const b = mix(BETA0, BETA1, k / 24); sh.push([-R * Math.cos(b), -s * R * Math.sin(b)]); }
          for (let k = 24; k >= 0; k--) { const b = mix(BETA0, BETA1, k / 24); sh.push([-(R - 0.75) * Math.cos(b), -s * (R - 0.75) * Math.sin(b)]); }
          const wall = slab(sh, -1.6, 0.6, mGate); g.add(wall);
          // gate face bands (darker lines)
          for (const yy of [-1.0, -0.45, 0.12]) {
            const pts = []; for (let k = 0; k <= 20; k++) { const b = mix(BETA0, BETA1, k / 20); pts.push(P(R + 0.02, b, yy)); }
            g.add(tube(pts, 0.035, M("#8d969f"), 40));
          }
          // truss: two levels converging at the joint
          const N = 10, yT = 0.95, yB = -0.95, yJ = 0.9;
          const J = V3(0, yJ, 0);
          const top = [], bot = [];
          for (let k = 0; k <= N; k++) { const b = mix(BETA0, BETA1, k / N); top.push(P(R - 0.8, b, yT)); bot.push(P(R - 0.8, b, yB)); }
          for (let k = 0; k <= N; k++) {
            if (k === 0 || k === N || k % 2 === 0) { g.add(beam(J, top[k], 0.16, mTruss)); g.add(beam(J, bot[k], 0.16, mTruss)); }
            g.add(beam(top[k], bot[k], 0.12, mTruss));
            if (k < N) { g.add(beam(top[k], top[k + 1], 0.14, mTruss)); g.add(beam(bot[k], bot[k + 1], 0.14, mTruss)); g.add(beam(top[k], bot[k + 1], 0.09, mTruss)); }
          }
          // inner lattice ring at 55 % radius
          for (let k = 0; k < N; k += 2) {
            const a = J.clone().lerp(top[k], 0.55), b = J.clone().lerp(top[k + 2], 0.55);
            const c = J.clone().lerp(bot[k], 0.55), d = J.clone().lerp(bot[k + 2], 0.55);
            g.add(beam(a, b, 0.1, mTruss)); g.add(beam(c, d, 0.1, mTruss)); g.add(beam(a, d, 0.08, mTruss));
          }
          // ball joint + housing
          const ball = new X.Mesh(new X.SphereGeometry(0.5, 40, 24), mJoint); ball.position.copy(J); g.add(ball);
          const ring = new X.Mesh(new X.TorusGeometry(0.56, 0.08, 10, 40), M("#5d6772", { metalness: 0.4, roughness: 0.4, flatShading: false }));
          ring.position.copy(J); ring.rotation.x = Math.PI / 2; g.add(ring);
          // little amber work lights on the gate top
          const lights = [];
          for (let k = 1; k < 6; k++) { const b = mix(BETA0, BETA1, k / 6); const l = new X.Mesh(new X.SphereGeometry(0.11, 10, 8), mAmber); l.position.copy(P(R - 0.35, b, 0.68)); g.add(l); lights.push(l); }
          return { g, ball, lights };
        }
        const AN = arm(-1), AS = arm(1);
        const armN = new X.Group(), armS = new X.Group();
        armN.position.set(JX, 0, -JZ); armS.position.set(JX, 0, JZ);
        armN.add(AN.g); armS.add(AS.g); SB.add(armN, armS);
        // joint foundations
        for (const s of [-1, 1]) { const f = new X.Mesh(new X.CylinderGeometry(1.5, 1.8, 2.6, 24), mConc); f.position.set(JX, -1.1, s * JZ); SB.add(f); }
        // gate tip position (world) for anchors
        const gateEnd = (side, b, y) => { const g = side < 0 ? AN.g : AS.g; const p = V3(-R * Math.cos(b), y, -side * R * Math.sin(b)); return g.localToWorld(p.clone()); };

        // ---------- shipping lane (cyan) and its halo
        const laneMesh = tube([V3(COAST - 220, 0.08, 0), V3(-20, 0.08, 0), V3(60, 0.08, 0), V3(LX, 0.08, 0)], 0.24, mCyan.clone(), 32);
        const laneHalo = tube([V3(COAST - 220, 0.06, 0), V3(-20, 0.06, 0), V3(60, 0.06, 0), V3(LX, 0.06, 0)], 0.95, halo(new X.Color(0.2, 0.9, 1.4), 0.16), 32);
        SB.add(laneMesh, laneHalo);
        // ---------- surge: a red front in the sea + a front inside the channel (+ faint trails)
        const seaFront = new X.Group(); SB.add(seaFront);
        {
          const mk = (off, r, mat) => { const pts = []; for (let z = -200; z <= 200; z += 10) pts.push(V3(off + 0.0016 * z * z, 0.1, z)); return tube(pts, r, mat, 60); };
          seaFront.add(mk(0, 0.24, mRed)); seaFront.add(mk(0, 0.9, halo(new X.Color(1.6, 0.1, 0.15), 0.16)));
          seaFront.add(mk(-9, 0.12, halo(new X.Color(1.8, 0.2, 0.25), 0.55))); seaFront.add(mk(-17, 0.08, halo(new X.Color(1.8, 0.2, 0.25), 0.35)));
        }
        const chanFront = new X.Group(); SB.add(chanFront);
        chanFront.add(beam(V3(0, 0.12, -17.6), V3(0, 0.12, 17.6), 0.18, mRed));
        chanFront.add(beam(V3(0, 0.1, -17.6), V3(0, 0.1, 17.6), 0.8, halo(new X.Color(1.6, 0.1, 0.15), 0.16)));
        chanFront.add(beam(V3(-5, 0.1, -17.6), V3(-5, 0.1, 17.6), 0.12, halo(new X.Color(1.8, 0.2, 0.25), 0.5)));
        // ---------- BOS building, node, gauges, dotted arcs
        const BOSP = V3(-30, 0.55, -34);
        { const b = new X.Mesh(new X.BoxGeometry(6, 1.8, 4), M("#262e39")); b.position.set(BOSP.x, 0.55 + 0.9, BOSP.z); SB.add(b);
          const b2 = new X.Mesh(new X.BoxGeometry(2.4, 1.0, 2.4), M("#2c3542")); b2.position.set(BOSP.x + 1.2, 0.55 + 2.3, BOSP.z); SB.add(b2);
          SB.add(beam(V3(BOSP.x + 1.2, 2.8, BOSP.z), V3(BOSP.x + 1.2, 4.6, BOSP.z), 0.1, M("#5a6573"))); }
        const nodeP = V3(BOSP.x + 1.2, 4.75, BOSP.z);
        const node = new X.Mesh(new X.SphereGeometry(0.32, 16, 12), mCyan); node.position.copy(nodeP); SB.add(node);
        const nodeHalo = glowSprite(new X.Color(0.3, 1.3, 1.9), 4.5, 0.9); nodeHalo.position.copy(nodeP); SB.add(nodeHalo);
        const nodeRing = new X.Mesh(new X.RingGeometry(1.6, 1.75, 64), halo(new X.Color(0.3, 1.2, 1.7), 0.6)); nodeRing.rotation.x = -Math.PI / 2; nodeRing.position.set(nodeP.x, 0.6, nodeP.z); SB.add(nodeRing);
        const GAUGES = [[COAST + 1, -24], [COAST + 1, -50], [COAST + 1, 26], [COAST + 1, 52], [-25, -18.6], [-25, 18.6], [25, -18.6], [50, 18.6], [75, -18.6]];
        const gaugeObj = GAUGES.map(([x, z]) => {
          const g = new X.Group(); g.position.set(x, 0, z);
          g.add(beam(V3(0, 0, 0), V3(0, 2.4, 0), 0.12, M("#4d5866")));
          const h = new X.Mesh(new X.SphereGeometry(0.2, 12, 10), mCyan); h.position.y = 2.5; g.add(h);
          const sp = glowSprite(new X.Color(0.3, 1.3, 1.9), 2.2, 0.8); sp.position.y = 2.5; g.add(sp);
          SB.add(g); return { g, top: V3(x, 2.5, z) };
        });
        function dotted(a, b, lift, n) { // quadratic arc of dots a -> b
          const pos = new Float32Array(n * 3);
          const c = a.clone().add(b).multiplyScalar(0.5); c.y += lift;

          arcGate.p.geometry.setDrawRange(0, sh.id === "hook" ? Math.round(arcGate.n * E.out(lin(t, 0.4, 2.6))) : 0);
          arcG.forEach((a, k) => a.p.geometry.setDrawRange(0, sh.id === "bos" ? Math.round(a.n * E.out(lin(t, sh.t0 + 0.15 + k * 0.17, sh.t0 + 0.95 + k * 0.17))) : 0));
          AN.lights.concat(AS.lights).forEach((l) => (l.visible = t > W.halt[5] || (sh.id === "hook" && t > 1.4)));

          // ----- map
          if (sh.id === "map") {
            mapRings.forEach((m, k) => {
              const ph2 = ((t - sh.t0) * 0.42 + k / mapRings.length) % 1;
              const r = 8 + ph2 * 95; m.scale.setScalar(r); m.material.opacity = (1 - ph2) * 0.95 * clamp((t - sh.t0) / 0.6);
            });
            const sp = 1 + 0.5 * Math.sin(t * 6); stormDot.scale.setScalar(sp);
            mapChan.material.color.setRGB(0.32, 1.75, 2.3);
            showTag("tPia", V3(5000 + stormC[0], 2, stormC[1]), lin(t, sh.t0 + 0.3, sh.t0 + 0.7), 24, -46);
            showTag("tRdam", V3(5000 + G.places.rotterdam[0], 2, G.places.rotterdam[1]), lin(t, W.channel[5], W.channel[5] + 0.3), 20, -18);
            showTag("tHoek", V3(5000 + G.places.barrier[0], 2, G.places.barrier[1]), lin(t, W.channel[5] + 0.25, W.channel[5] + 0.55), -230, 20);
          }
          // ----- section
          if (sh.id === "section") {
            const tide = mix(-1.6, 1.4, E.io(lin(t, W.tide[1], W.tide[7] + 0.3)));
            const surgeK = E.io(lin(t, W.surge[3], W.surge[9] + 0.3));
            const p = wsGeo.attributes.position, nCol = p.count;
            const sy = (x) => tide + surgeK * 3.0 * Math.pow(clamp((x + 30) / 38), 1.6) + 0.12 * Math.sin(x * 0.9 + t * 3);
            for (let i = 0; i < nCol; i++) {
              const xx = -30 + (i % (NX + 1)) / NX * 44;
              p.setXYZ(i, xx, sy(xx), p.getZ(i));
              const red = surgeK * clamp((xx + 10) / 20);
              wsCol.set([mix(0.06, 0.55, red), mix(0.16, 0.08, red), mix(0.24, 0.12, red)], i * 3);
            }
            p.needsUpdate = true; wsGeo.attributes.color.needsUpdate = true; wsGeo.computeVertexNormals();
            const sl = surfLine.geometry.attributes.position;
            for (let k = 0; k <= NX; k++) {
              const xx = -30 + k / NX * 44, y = sy(xx), yb = Math.max(bedY(xx), -13);
              ffPos.set([xx, y, XD / 2 + 0.02, xx, Math.min(yb, y), XD / 2 + 0.02], k * 6);
              const red = surgeK * clamp((xx + 10) / 20) * clamp((y - tide) / 1.5);
              ffCol.set([mix(0.07, 0.5, red), mix(0.2, 0.06, red), mix(0.32, 0.1, red), 0.025, 0.07, 0.12], k * 6);
              sl.setXYZ(k, xx, y + 0.03, XD / 2 + 0.05);
            }
            ffGeo.attributes.position.needsUpdate = true; ffGeo.attributes.color.needsUpdate = true; sl.needsUpdate = true;
            surfLine.material.color.setRGB(mix(0.45, 1.0, surgeK), mix(0.86, 0.3, surgeK), mix(1.0, 0.35, surgeK));
            chevs.forEach((cv, k) => {
              const ph2 = ((t * 0.55 + k * 0.13) % 1);
              cv.l.position.set(-5000 + 0, 0, 0); cv.l.position.set(-30 + ph2 * 40, cv.y + sy(-30 + ph2 * 40) + 1.5, cv.z);
              cv.l.material.opacity = surgeK * Math.sin(Math.PI * ph2) * 0.9;
            });
            showTag("tTide", V3(-5000 - 20, tide + 0.6, XD / 2), lin(t, W.tide[1], W.tide[1] + 0.3), 14, -50);
            showTag("tSurge", V3(-5000 + 4, sy(4) + 0.4, XD / 2), lin(t, W.surge[9] - 0.25, W.surge[9] + 0.1), -340, -66);
          }
          // ----- gauge
          if (sh.id === "gauge") {
            const lvl = mix(1.2, 2.88, E.io(lin(t, sh.t0, W.rule[13] + 0.2)));
            gLevel.position.y = lvl;
            const hit = pulse(W.rule[13] + 0.1, 0.45), rp = t - (W.rule[13] + 0.05);
            headHalo.scale.setScalar(1.6 + 4.5 * clamp(rp / 0.4) * (rp > 0 ? 1 : 0) * Math.exp(-Math.max(0, rp - 0.4) * 0.8));
            headHalo.material.opacity = 0.75;
            headRing.visible = rp > 0 && rp < 1.6; if (headRing.visible) { headRing.position.set(0, lvl + 0.02, 0); headRing.scale.setScalar(0.4 + rp * 2.2); headRing.material.opacity = 0.75 * (1 - rp / 1.6); }
            thrHalo.material.opacity = 0.1 + 0.25 * hit + 0.1 * clamp((lvl - 2.4) / 0.5);
            showTag("tNap", V3(-0.6, 3.0, 5000 - 0.2), lin(t, W.rule[3], W.rule[3] + 0.3), -330, -60);
          }
          // ----- barrier-shot overlays
          if (sh.id === "channel") showBracket("b360", V3(-22, 0.6, -18), V3(-22, 0.6, 18), lin(t, W.channel[11] - 0.05, W.channel[11] + 0.4), -130);
          if (sh.id === "bos") showTag("tBos", nodeP, lin(t, W.agency[12] - 0.15, W.agency[12] + 0.2), 26, -24);
          if (sh.id === "evening") showTag("tHalt", V3(ship.position.x, 1.8, ship.position.z), lin(t, W.halt[2] - 0.2, W.halt[2] + 0.15), -330, -60);
          if (sh.id === "docks") {
            const a = gateEnd(-1, BETA0, 1.3), b = gateEnd(-1, BETA1, 1.3);
            showBracket("b210", a, b, lin(t, W.gates[4] - 0.1, W.gates[4] + 0.35), 10);
          }
          if (sh.id === "joint") {
            showTag("tJoint", V3(JX, 0.9 + gy + 1.6, -JZ), lin(t, W.gates[9] - 0.1, W.gates[9] + 0.25), -200, 90);
          }
          composer.render();
          window.__anchorShot = sh.id;
        };
        ready = true; lastT = -1; draw(curT);
      }).catch((e) => { window.__error = "world: " + (e && e.message ? e.message : e); throw e; });
      window.addEventListener("hf-seek", (e) => draw(e.detail.time));
      const tl = gsap.timeline({ paused: true });
      const clock = { t: 0 };
      tl.to(clock, { t: F.DUR, duration: F.DUR, ease: "none", onUpdate: () => draw(clock.t) }, 0);
      window.__timelines["world"] = tl;
    })();
  </script>
