  <script>
    (function () {
      const F = window.FILM, V = F.V, W = F.W, T = F.T;
      const { lin, mix, clamp, E } = F;
      const $ = (id) => document.getElementById(id);
      const NAMES = ["MAESLANT", "HARTEL", "OOSTERSCHELDE", "HARINGVLIET", "HOLL. IJSSEL", "RAMSPOL"];
      const ICON = '<svg viewBox="0 0 120 52"><path d="M8 44 Q60 4 112 44" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round"/><path d="M8 48 L112 48" stroke="currentColor" stroke-width="3" opacity="0.5"/></svg>';
      NAMES.forEach((n, k) => ($("g" + k).innerHTML = ICON + '<div class="tn">' + n + "</div>"));
      let capKey = "";
      function caption(t) {
        const P = V.phrases;
        let p = null;
        for (let k = 0; k < P.length; k++) if (t >= P[k].on && t < P[k].off) { p = P[k]; break; }
        const el = $("cap");
        if (!p) { el.style.opacity = "0"; capKey = ""; return; }
        const nOn = p.w.filter((w) => t >= w[1] - 0.02).length;
        const key = p.on + ":" + nOn;
        if (key !== capKey) {
          el.innerHTML = p.w.map((w, k) => '<span class="w' + (k < nOn ? " on" : "") + '">' + w[0] + "</span>").join(" ");
          capKey = key;
        }
        const a = E.out(lin(t, p.on, p.on + 0.14)) * (1 - lin(t, p.off - 0.06, p.off));
        el.style.opacity = String(a);
        el.style.transform = `translate(-50%, -50%) translateY(${(1 - E.out(lin(t, p.on, p.on + 0.18))) * 10}px)`;
      }
      function draw(t) {
        const sh = F.shotAt(t);
        // HUD panel
        const st = F.status(t), amb = F.amber(t);
        $("st").textContent = st;
        const dot = $("dot");
        if (st === "OPEN") { dot.style.background = "#39d7ff"; dot.style.border = "0"; dot.style.boxShadow = "0 0 16px rgba(57,215,255,0.9)"; }
        else if (st === "CLOSING") { const k = 0.55 + 0.45 * Math.abs(Math.sin(t * 4)); dot.style.background = `rgba(255,178,63,${k})`; dot.style.border = "0"; dot.style.boxShadow = `0 0 ${10 + 10 * k}px rgba(255,178,63,0.8)`; }
        else { dot.style.background = "transparent"; dot.style.border = "3px solid #5c6773"; dot.style.boxShadow = "none"; }
        $("st").style.fontSize = st === "CLOSING" ? "56px" : "64px";
        const g = F.gap(t);
        $("gap").innerHTML = "~" + g + '<span class="unit">m</span>';
        $("gap").style.color = amb ? "#ffb23f" : "#f3f6f9";
        $("chev").style.opacity = amb && st !== "CLOSED" ? "1" : (amb && t < F.SH[1].t0 ? "1" : "0");
        if (amb) $("chev").style.transform = `translateY(${(Math.sin(t * 5) * 3).toFixed(1)}px)`;
        // location pill
        const pill = $("pill");
        if (sh.loc) { pill.style.opacity = "1"; if (pill.textContent !== sh.loc) pill.textContent = sh.loc; } else pill.style.opacity = "0";
        if (sh.id === "map" && t >= W.channel[0] - 0.05) pill.textContent = "NIEUWE WATERWEG · 2023";
        // photo inset (map shot)
        const pin = sh.id === "map" ? E.out(lin(t, W.channel[3] - 0.1, W.channel[3] + 0.3)) * (1 - lin(t, sh.t1 - 0.2, sh.t1)) : 0;
        $("photo").style.opacity = String(pin); $("credit").style.opacity = String(pin);
        $("photo").style.transform = `translateY(${(1 - pin) * 30}px) scale(${0.94 + 0.06 * pin})`;
        // agency card
        const cin = sh.id === "agency" ? E.back(clamp(lin(t, W.agency[2] - 0.1, W.agency[2] + 0.25))) * (1 - lin(t, sh.t1 - 0.25, sh.t1 - 0.02)) : 0;
        $("card").style.opacity = String(clamp(cin)); $("card").style.transform = `scale(${0.86 + 0.14 * cin})`;
        // time panel
        const tin = sh.id === "panel" ? E.out(lin(t, sh.t0 + 0.05, sh.t0 + 0.35)) : 0;
        $("tpan").style.opacity = String(tin); $("tpan").style.transform = `translateY(${(1 - tin) * 24}px)`;
        if (tin > 0) {
          $("f1").style.width = "100%";
          const k2 = E.io(lin(t, sh.t0 + 0.2, W.time[5] + 0.3));
          $("f2").style.width = (6 + 74 * k2).toFixed(1) + "%"; $("h2").style.width = (80 * k2).toFixed(1) + "%";
          const bk = E.back(clamp(lin(t, W.time[5] - 0.05, W.time[5] + 0.3)));
          $("big").style.opacity = String(clamp(bk)); $("big").style.transform = `scale(${0.7 + 0.3 * bk})`;
        }
        // barrier grid + counters (last shot)
        const gin = sh.id === "six" ? E.out(lin(t, sh.t0 + 0.1, sh.t0 + 0.4)) : 0;
        $("gpan").style.opacity = String(gin); $("gpan").style.transform = `translateY(${(1 - gin) * 24}px)`;
        if (gin > 0) {
          const t0 = W.six[2], t1 = W.six[10];
          for (let k = 0; k < 6; k++) {
            const tile = $("g" + k), on = t >= mix(t0, t1, k / 5), green = t >= W.six[11] - 0.05;
            const col = green ? "#36e0a0" : on ? "#ffb23f" : "#5c6773";
            tile.style.color = col; tile.style.borderColor = green ? "rgba(54,224,160,0.85)" : on ? "rgba(255,178,63,0.85)" : "rgba(160,180,200,0.22)";
            tile.style.background = green ? "rgba(54,224,160,0.1)" : on ? "rgba(255,178,63,0.1)" : "rgba(160,180,200,0.06)";
            tile.querySelector(".tn").style.color = green || on ? "#eef2f6" : "#7c8791";
            const pop = Math.exp(-Math.pow((t - mix(t0, t1, k / 5) - 0.08) / 0.09, 2));
            tile.style.transform = `scale(${1 + 0.06 * pop})`;
          }
        }
        const cpin = sh.id === "six" ? E.out(lin(t, T.end - 0.12, T.end + 0.2)) : 0;
        $("cpan").style.opacity = String(cpin); $("cpan").style.transform = `translateY(${(1 - cpin) * 24}px)`;
        if (cpin > 0) {
          const k1 = E.out(lin(t, W.end[1], W.end[1] + 0.9));
          $("n1").textContent = (1.5 * k1).toFixed(1) + "M";
          const g1 = t >= W.end[3];
          $("n1").style.color = g1 ? "#36e0a0" : "#d9e0e7"; $("l1").style.color = g1 ? "#eef2f6" : "#8d98a4";
          const g2 = t >= W.end[14];
          $("n2").style.color = g2 ? "#36e0a0" : "#5f6a76"; $("l2").style.color = g2 ? "#eef2f6" : "#8d98a4";
          const pp = Math.exp(-Math.pow((t - W.end[14] - 0.1) / 0.1, 2)); $("n2").style.transform = `scale(${1 + 0.12 * pp})`;
        }
        caption(t);
      }
      const tl = gsap.timeline({ paused: true });
      const clock = { t: 0 };
      tl.to(clock, { t: F.DUR, duration: F.DUR, ease: "none", onUpdate: () => draw(clock.t) }, 0);
      window.__timelines["hud"] = tl;
      window.addEventListener("hf-seek", (e) => draw(e.detail.time));
      draw(0);
    })();
  </script>
