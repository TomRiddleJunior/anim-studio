    <div class="clip cap" id="cap0" data-start="0.18" data-duration="0.6"><span class="cw">A jet built</span></div>
    <div class="clip cap" id="cap1" data-start="0.78" data-duration="1.375"><span class="cw">to break the sound barrier,</span></div>
    <div class="clip cap" id="cap2" data-start="2.155" data-duration="1.785"><span class="cw">without the big boom.</span></div>
    <div class="clip cap" id="cap3" data-start="3.94" data-duration="1.925"><span class="cw">It's NASA's X-59,</span></div>
    <div class="clip cap" id="cap4" data-start="5.865" data-duration="1.225"><span class="cw">built by Lockheed Martin</span></div>
    <div class="clip cap" id="cap5" data-start="7.09" data-duration="2.185"><span class="cw">for quiet supersonic flight.</span></div>
    <div class="clip cap" id="cap6" data-start="9.275" data-duration="1.725"><span class="cw">An airliner flies over land,</span></div>
    <div class="clip cap" id="cap7" data-start="11.0" data-duration="1.885"><span class="cw">but slower than sound.</span></div>
    <div class="clip cap" id="cap8" data-start="12.885" data-duration="1.487"><span class="cw">A fighter jet goes faster,</span></div>
    <div class="clip cap" id="cap9" data-start="14.372" data-duration="0.913"><span class="cw">but its sonic boom</span></div>
    <div class="clip cap" id="cap10" data-start="15.285" data-duration="1.56"><span class="cw">rattles windows.</span></div>
    <div class="clip cap" id="cap11" data-start="16.845" data-duration="1.685"><span class="cw">This one wants both.</span></div>
    <div class="clip cap" id="cap12" data-start="18.53" data-duration="1.45"><span class="cw">In 1973,</span></div>
    <div class="clip cap" id="cap13" data-start="19.98" data-duration="0.825"><span class="cw">the U.S. banned</span></div>
    <div class="clip cap" id="cap14" data-start="20.805" data-duration="1.413"><span class="cw">civilian supersonic flight</span></div>
    <div class="clip cap" id="cap15" data-start="22.218" data-duration="1.347"><span class="cw">over land.</span></div>
    <div class="clip cap" id="cap16" data-start="23.565" data-duration="1.635"><span class="cw">The secret is its shape.</span></div>
    <div class="clip cap" id="cap17" data-start="25.2" data-duration="1.612"><span class="cw">On most supersonic jets,</span></div>
    <div class="clip cap" id="cap18" data-start="26.812" data-duration="0.613"><span class="cw">shock waves</span></div>
    <div class="clip cap" id="cap19" data-start="27.425" data-duration="1.113"><span class="cw">from the nose and wings</span></div>
    <div class="clip cap" id="cap20" data-start="28.538" data-duration="2.172"><span class="cw">merge into one big boom.</span></div>
    <div class="clip cap" id="cap21" data-start="30.71" data-duration="2.325"><span class="cw">The X-59's long, thin nose</span></div>
    <div class="clip cap" id="cap22" data-start="33.035" data-duration="0.937"><span class="cw">is almost a third</span></div>
    <div class="clip cap" id="cap23" data-start="33.972" data-duration="1.173"><span class="cw">of its length.</span></div>
    <div class="clip cap" id="cap24" data-start="35.145" data-duration="1.012"><span class="cw">Stretched out like that,</span></div>
    <div class="clip cap" id="cap25" data-start="36.157" data-duration="2.048"><span class="cw">the shock waves don't merge.</span></div>
    <div class="clip cap" id="cap26" data-start="38.205" data-duration="1.55"><span class="cw">The engine sits on top,</span></div>
    <div class="clip cap" id="cap27" data-start="39.755" data-duration="0.775"><span class="cw">aiming its noise</span></div>
    <div class="clip cap" id="cap28" data-start="40.53" data-duration="1.56"><span class="cw">away from the ground.</span></div>
    <div class="clip cap" id="cap29" data-start="42.09" data-duration="0.725"><span class="cw">So people below</span></div>
    <div class="clip cap" id="cap30" data-start="42.815" data-duration="1.25"><span class="cw">should hear a soft thump,</span></div>
    <div class="clip cap" id="cap31" data-start="44.065" data-duration="1.71"><span class="cw">if anything at all.</span></div>

    <div class="clip cap" id="cap33" data-start="46.475" data-duration="1.3"><span class="cw">almost halfway back,</span></div>
    <div class="clip cap" id="cap34" data-start="47.775" data-duration="1.785"><span class="cw">with no forward window.</span></div>

    <div class="clip cap" id="cap36" data-start="50.398" data-duration="1.3"><span class="cw">on a 4K screen,</span></div>
    <div class="clip cap" id="cap37" data-start="51.698" data-duration="1.622"><span class="cw">fed by cameras.</span></div>
    <div class="clip cap" id="cap38" data-start="53.32" data-duration="0.975"><span class="cw">It's built to cruise</span></div>
    <div class="clip cap" id="cap39" data-start="54.295" data-duration="1.5"><span class="cw">at Mach 1.4,</span></div>
    <div class="clip cap" id="cap40" data-start="55.795" data-duration="2.935"><span class="cw">about 925 miles an hour.</span></div>
    <div class="clip cap" id="cap41" data-start="58.73" data-duration="0.763"><span class="cw">NASA will fly it</span></div>
    <div class="clip cap" id="cap42" data-start="59.493" data-duration="1.275"><span class="cw">over U.S. towns</span></div>
    <div class="clip cap" id="cap43" data-start="60.768" data-duration="0.75"><span class="cw">and ask people</span></div>
    <div class="clip cap" id="cap44" data-start="61.518" data-duration="1.222"><span class="cw">what they heard.</span></div>
    <div class="clip cap" id="cap45" data-start="62.74" data-duration="1.1"><span class="cw">That helps regulators</span></div>
    <div class="clip cap" id="cap46" data-start="63.84" data-duration="1.1"><span class="cw">set a noise limit</span></div>
    <div class="clip cap" id="cap47" data-start="64.94" data-duration="1.038"><span class="cw">for supersonic flight</span></div>
    <div class="clip cap" id="cap48" data-start="65.978" data-duration="1.397"><span class="cw">over land.</span></div>
    <div class="clip cap" id="cap49" data-start="67.375" data-duration="0.65"><span class="cw">The hard part</span></div>
    <div class="clip cap" id="cap50" data-start="68.025" data-duration="0.9"><span class="cw">is proving it works</span></div>
    <div class="clip cap" id="cap51" data-start="68.925" data-duration="1.51"><span class="cw">in real air.</span></div>
    <div class="clip cap" id="cap52" data-start="70.435" data-duration="1.275"><span class="cw">In 2003,</span></div>

    <div class="clip cap" id="cap55" data-start="73.81" data-duration="1.76"><span class="cw">made a quieter boom.</span></div>
    <div class="clip cap" id="cap56" data-start="75.57" data-duration="1.662"><span class="cw">The X-59 first flew</span></div>
    <div class="clip cap" id="cap57" data-start="77.232" data-duration="2.898"><span class="cw">on October 28, 2025.</span></div>
    <div class="clip cap" id="cap58" data-start="80.13" data-duration="2.15"><span class="cw">On June 5, 2026,</span></div>

    <div class="clip cap" id="cap61" data-start="84.64" data-duration="1.075"><span class="cw">The chase plane's booms</span></div>
    <div class="clip cap" id="cap62" data-start="85.715" data-duration="1.012"><span class="cw">drowned out any sound</span></div>
    <div class="clip cap" id="cap63" data-start="86.727" data-duration="1.923"><span class="cw">from the X-59.</span></div>
    <div class="clip cap" id="cap64" data-start="88.65" data-duration="0.925"><span class="cw">By October,</span></div>
    <div class="clip cap" id="cap65" data-start="89.575" data-duration="0.612"><span class="cw">it was flying</span></div>
    <div class="clip cap" id="cap66" data-start="90.187" data-duration="1.125"><span class="cw">at Mach 1.4</span></div>
    <div class="clip cap" id="cap67" data-start="91.312" data-duration="2.173"><span class="cw">and 55,000 feet.</span></div>
    <div class="clip cap" id="cap68" data-start="93.485" data-duration="0.4"><span class="cw">Next,</span></div>
    <div class="clip cap" id="cap69" data-start="93.885" data-duration="1.525"><span class="cw">NASA measures the thump,</span></div>
    <div class="clip cap" id="cap70" data-start="95.41" data-duration="1.175"><span class="cw">then flies over towns</span></div>
    <div class="clip cap" id="cap71" data-start="96.585" data-duration="2.355"><span class="cw">to see if anyone hears it.</span></div>
