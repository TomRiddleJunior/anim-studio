<template>
  <style>
    @font-face { font-family: "SKInter"; src: url("assets/fonts/Inter_opsz-wght_.ttf"); font-weight: 100 900; }
    @font-face { font-family: "SKMono"; src: url("assets/fonts/JetBrainsMono-700.woff2"); font-weight: 700; }
    #root { position: absolute; inset: 0; overflow: hidden; background: #000; }
    #world-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  </style>
  <div id="root" data-composition-id="world" data-width="1080" data-height="1920">
    <canvas id="world-canvas" width="1080" height="1920" data-layout-allow-overflow></canvas>
  </div>
  <script>
    (function () {
      const DUR = 14;
      const K = window.SK.create({ canvas: document.getElementById("world-canvas"), width: 1080, height: 1920 });
      const film = window.SK_FILM(K);
      let ready = false, lastT = -1, curT = 0;
      function draw(t) {
        curT = t;
        t = Math.round(t * 10000) / 10000;
        if (!ready || t === lastT) return;
        lastT = t;
        film.draw(t);
      }
      window.__sk = { K, film, draw: (t) => { lastT = -1; draw(t); } };
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady.world = K.ready.then(() => { ready = true; lastT = -1; draw(curT); });
      window.addEventListener("hf-seek", (e) => draw(e.detail.time));
      const tl = gsap.timeline({ paused: true });
      const clock = { t: 0 };
      tl.to(clock, { t: DUR, duration: DUR, ease: "none", onUpdate: () => draw(clock.t) }, 0);
      window.__timelines["world"] = tl;
    })();
  </script>
</template>
