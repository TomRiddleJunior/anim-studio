<template>
  <style>
    @font-face { font-family: "SVPop"; src: url("assets/fonts/Poppins-SemiBold.ttf"); font-weight: 600; }
    @font-face { font-family: "SVPop"; src: url("assets/fonts/Poppins-Bold.ttf"); font-weight: 700; }
    @font-face { font-family: "SVPop"; src: url("assets/fonts/Poppins-ExtraBold.ttf"); font-weight: 800; }
    @font-face { font-family: "SVHand"; src: url("assets/fonts/PatrickHand-Regular.ttf"); font-weight: 400; }
    #root { position: absolute; inset: 0; overflow: hidden; background: #0c0a08; }
    #world-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  </style>
  <div id="root" data-composition-id="world" data-width="1080" data-height="1920">
    <canvas id="world-canvas" width="1080" height="1920" data-layout-allow-overflow></canvas>
  </div>
  <script>
    (function () {
      const DUR = 155.43;
      const VOD = window.SV_VO;
      const norm = (s) => s.toLowerCase().replace(/[^a-z0-9']/g, "");
      const V = {
        duration: VOD.duration,
        L(id) { const l = VOD.lines[id]; if (!l) throw new Error("no line " + id); return l; },
        w(id, word, k) {
          const hits = VOD.lines[id].words.filter((x) => norm(x[0]).startsWith(norm(word)));
          if (!hits.length) throw new Error("no word " + id + ":" + word);
          return hits[Math.min(k || 0, hits.length - 1)][1];
        },
        we(id, word, k) {
          const hits = VOD.lines[id].words.filter((x) => norm(x[0]).startsWith(norm(word)));
          return hits[Math.min(k || 0, hits.length - 1)][2];
        },
      };
      const K = window.SV.create({ canvas: document.getElementById("world-canvas"), width: 1080, height: 1920 });
      const film = window.SV_FILM(K, V);
      let ready = false, lastT = -1, curT = 0;
      function draw(t) {
        curT = t;
        t = Math.round(t * 10000) / 10000;
        if (!ready || t === lastT) return;
        lastT = t;
        film.draw(t);
      }
      window.__sv = { K, film, draw: (t) => { lastT = -1; draw(t); } };
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady.world = K.ready.then(() => { ready = true; lastT = -1; draw(curT); });
      window.addEventListener("hf-seek", (e) => draw(e.detail.time));
      const tl = gsap.timeline({ paused: true });
      const clock = { t: 0 };
      tl.to(clock, { t: DUR, duration: DUR, ease: "none", onUpdate: () => draw(clock.t) }, 0);
      window.__timelines["world"] = tl;
    })();
  </script>
</template>
