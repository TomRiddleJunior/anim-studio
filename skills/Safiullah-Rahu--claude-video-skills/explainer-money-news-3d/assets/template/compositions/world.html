<template>
  <style>
    @font-face { font-family: "Oswald"; src: url("assets/fonts/Oswald_wght_.ttf"); font-weight: 200 700; }
    @font-face { font-family: "Roboto Mono"; src: url("assets/fonts/RobotoMono_wght_.ttf"); font-weight: 100 700; }
    #root { position: absolute; inset: 0; overflow: hidden; background: #050608; }
    #world-canvas { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  </style>
  <div id="root" data-composition-id="world" data-width="1080" data-height="1920">
    <canvas id="world-canvas" width="1080" height="1920" data-layout-allow-overflow></canvas>
  </div>
  <script>
    (function () {
      const TL = window.MN_TL, DUR = TL.dur;
      // 3D scenes and the range each one must cover (its own span, plus the frames a card needs to push over or wipe off it)
      const RANGES = TL.scenes.filter((s) => s.kind === "3d").map((s) => ({ id: s.id, a: s.t0 - (s.pre || 0), b: s.t1 + (s.hold || 0) }));
      let K = null, SH = null, ready = false, lastT = -1, curT = 0;
      function draw(t) {
        curT = t;
        t = Math.round(t * 10000) / 10000;
        if (!ready || t === lastT) return;
        lastT = t;
        // the scene whose own span holds t wins; otherwise one whose padded range holds it; otherwise a card covers the frame
        let r = RANGES.find((x) => { const s = TL.scenes.find((y) => y.id === x.id); return t >= s.t0 && t < s.t1; });
        if (!r) r = RANGES.find((x) => t >= x.a && t < x.b);
        if (!r) return;
        K.render(Object.assign({ t }, SH[r.id](t)));
      }
      const fontsReady = Promise.all([
        document.fonts.load('700 100px "Oswald"'), document.fonts.load('500 30px "Roboto Mono"'),
        document.fonts.load('600 30px "Roboto Mono"'), document.fonts.load('700 30px "Roboto Mono"'),
      ]).catch(() => null);
      const fontsOrTimeout = Promise.race([fontsReady, new Promise((r) => setTimeout(r, 6000))]);
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady.world = fontsOrTimeout.then(() => {
        K = window.MONEYKIT.create({ canvas: document.getElementById("world-canvas"), width: 1080, height: 1920 });
        SH = window.MN_SHOTS(K, TL);
        return K.ready;
      }).then(() => { ready = true; lastT = -1; draw(curT); });
      window.addEventListener("hf-seek", (e) => draw(e.detail.time));
      const tl = gsap.timeline({ paused: true });
      const clock = { t: 0 };
      tl.to(clock, { t: DUR, duration: DUR, ease: "none", onUpdate: () => draw(clock.t) }, 0);
      window.__timelines["world"] = tl;
    })();
  </script>
</template>
