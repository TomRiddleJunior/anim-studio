            leader(bx + 12, by + 12, bx + 120, by + 170, a2); label(bx + 60, by + 170, "1988 – 89", "FILES LOST · REGIME CHANGE", a2, { fill: "rgba(255,255,255,0.75)", stroke: "rgba(0,0,0,0.5)", c1: "#111", c2: "#555" });
          } else if (id === "quotes") {

            const la = E.out(lin(t, t0, t0 + 0.3));

            textC(hdr[0], 540, 700, MONO(700, 28), "#d0d0d0", la, 5); textC(hdr[1], 540, 744, MONO(500, 20), "#7a7a7a", la, 3);
            const qs = two ? 74 : 92;
            textC(q, 540, 900, `600 ${qs}px Inter`, "#f0f0f0", qa, -1);

            textC("INFORMER REPORTS PUBLISHED", 540, 740, MONO(700, 24), "#bdbdbd", la, 4);
            textC("0", 540, 960, "300 210px Inter", "#f2f2f2", na, 0);
            textC("OPEN ONLY TO THOSE AFFECTED", 540, 1060, MONO(500, 21), "#8a8a8a", sa, 3);
          }
        }

        function overlays(sh, t, u) {     // labels drawn over the 3D shots
          if (sh.id === "tape") {
            const [rx, ry] = P2(-0.32, 1.78, 0.5);
            const a1 = E.out(lin(t, W.tape[1] - 0.15, W.tape[1] + 0.2));

            const a3 = E.out(lin(t, W.tape[9] - 0.1, W.tape[9] + 0.25));
            const [hx, hy] = P2(0.32, 1.78, 0.5); leader(hx + 30, hy + 30, 800, 1120, a3); label(700, 1120, "NO REPORTS", "NO PHOTOS", a3);
          } else if (sh.id === "corridor") {

            textC("AGENTS · OVER FOUR DECADES", 540, 576, MONO(700, 22), "#9a9a9a", ca, 4);
            const ta = E.out(lin(t, W.scale[7] - 0.1, W.scale[7] + 0.3));
            textC("≈ 1/3 KNOWN BY NAME", 540, 640, MONO(700, 30), "#e6e6e6", ta, 4);
          } else if (sh.id === "cabinet") {
            const ha = E.out(lin(t, sh.t0 + 0.1, sh.t0 + 0.5));
            label(60, 300, "ÁBTL ARCHIVE · BUDAPEST", "OPEN FILES · NEXT PHASE", ha, { box: false, s1: 25, s2: 21, c1: "#e2e2e2", c2: "#8a8a8a" });
            const a1 = E.out(lin(t, W.next[2] - 0.12, W.next[2] + 0.2)), a2 = E.out(lin(t, W.next[7] - 0.12, W.next[7] + 0.2));
            label(60, 1090, "RECRUITMENT FILES › 9,000+", null, a1, { s1: 22 });
            label(60, 1150, "DUE BY › 25 FEB 2027", null, a2, { s1: 22, c1: "#ffffff", stroke: "rgba(255,255,255,0.85)" });
          } else if (sh.id === "desk") {
            const a = E.out(lin(t, W.names[1] - 0.1, W.names[1] + 0.2)) * (1 - lin(t, sh.t1 - 0.2, sh.t1));
            label(60, 452, "~60,000 NAMES", "ONLINE · 4 NOV 2026", a, { fill: "rgba(0,0,0,0.78)" });
          }
        }

        ready = true; lastT = -1; draw(curT);
      }).catch((e) => { window.__error = "world: " + (e && e.message ? e.message : e); throw e; });
      window.addEventListener("hf-seek", (e) => draw(e.detail.time));
      const tl = gsap.timeline({ paused: true });
      const clock = { t: 0 };
      tl.to(clock, { t: F.DUR, duration: F.DUR, ease: "none", onUpdate: () => draw(clock.t) }, 0);
      window.__timelines["world"] = tl;
    })();
  </script>
